[project]
name = "ai-experiments"
version = "0.1.0"
description = "AI and local-LLM experiments — planning, code, and results."
requires-python = ">=3.10"
dependencies = [
    "huggingface-hub>=0.25",
    "datasets>=2.20",
    "numpy>=1.26",
    "pandas>=2.2",
    "matplotlib>=3.8",
    "rich>=13.7",
    "python-dotenv>=1.0",
    "requests>=2.32",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.6",
    "pytest>=8.0",
    "ipykernel>=6.29",
    "jupyterlab>=4.2",
]

[tool.uv]
package = false
# Heavy / platform-specific deps (CUDA `torch`, `vllm`, `bitsandbytes`,
# `mlx`/`mlx-lm`, ...) are intentionally NOT declared here — add them per
# experiment so `uv sync` stays portable across macOS, CUDA boxes, and cloud GPUs.

[tool.ruff]
line-length = 100
target-version = "py310"
